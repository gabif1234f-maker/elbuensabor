<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes Registrados</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .table-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 950px;
            margin: 20px auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        .data-table th, .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-table th {
            background-color: #1e3a8a;
            color: white;
            font-weight: 600;
        }
        .data-table tr:hover {
            background-color: #f8fafc;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }
        .btn-table-map {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-table-map:hover {
            background-color: #2563eb;
        }
        .empty-msg {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: #1e3a8a;">📋 Base de Datos de Clientes y WiFi</h2>
            <a href="index.html" class="btn-secondary" style="text-decoration: none;">➕ Registrar Nuevo</a>
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Ubicación</th>
                    <th>Red (SSID)</th>
                    <th>Contraseña</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaClientes">
                <!-- Se estructura vía Script -->
            </tbody>
        </table>
    </div>

    <script>
        function mostrarRegistros() {
            var tablaBody = document.getElementById('tablaClientes');
            if (!tablaBody) return;

            var listaClientes = JSON.parse(localStorage.getItem('wifi_records')) || [];
            tablaBody.innerHTML = "";

            if (listaClientes.length === 0) {
                tablaBody.innerHTML = '<tr><td colspan="5" class="empty-msg">No hay clientes registrados todavía.</td></tr>';
                return;
            }

            listaClientes.forEach(function(cliente) {
                var fila = document.createElement('tr');
                var urlMaps = "https://google.com" + encodeURIComponent(cliente.ubicacion);

                fila.innerHTML = `
                    <td><strong>${cliente.nombre}</strong></td>
                    <td>${cliente.ubicacion}</td>
                    <td><code>${cliente.red}</code></td>
                    <td><span style="font-family: monospace; font-weight: bold; background: #fffbeb; padding: 2px 6px; border-radius: 4px;">${cliente.password}</span></td>
                    <td>
                        <a href="${urlMaps}" target="_blank" class="btn-table-map" style="margin-right: 5px;">🗺️ Ver mapa</a>
                        <button class="btn-danger" onclick="eliminarRegistro(${cliente.id})">❌ Borrar</button>
                    </td>
                `;
                tablaBody.appendChild(fila);
            });
        }

        function eliminarRegistro(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este registro?")) {
                var listaClientes = JSON.parse(localStorage.getItem('wifi_records')) || [];
                listaClientes = listaClientes.filter(function(c) { return c.id !== id; });
                localStorage.setItem('wifi_records', JSON.stringify(listaClientes));
                mostrarRegistros();
            }
        }

        // Carga inicial automática
        document.addEventListener('DOMContentLoaded', mostrarRegistros);
    </script>
</body>
</html>
