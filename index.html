<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Redes WiFi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <div style="text-align: right; margin-bottom: 15px;">
            <a href="registros.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">📋 Ver Clientes Registrados</a>
        </div>

        <div class="form-header">
            <h2>🔑 Registro de Contraseñas WiFi</h2>
            <p>Guarda y organiza las credenciales de acceso de tus clientes.</p>
        </div>
        
        <form id="wifiForm">
            <!-- SECCIÓN: DATOS DEL CLIENTE -->
            <fieldset class="form-section">
                <legend>Datos del Cliente</legend>
                
                <div class="form-group">
                    <label for="nombreCliente">Nombre del Cliente</label>
                    <input type="text" id="nombreCliente" placeholder="Ej. Juan Carlos Pérez" required>
                </div>

                <div class="form-group">
                    <label for="ubicacion">Ubicación / Dirección</label>
                    <div class="input-action-group">
                        <input type="text" id="ubicacion" placeholder="Coordenadas o Dirección" required>
                        <button type="button" id="btnGeolocalizar" class="btn-action">📍 Mi posición</button>
                    </div>
                    <!-- Enlace nativo inbloqueable -->
                    <a id="btnVerMapa" class="btn-secondary" style="margin-top: 8px; text-decoration: none; display: block; text-align: center; line-height: 20px;" target="_blank" href="https://google.com">🌐 Ver en Google Maps</a>
                </div>
            </fieldset>

            <!-- SECCIÓN: DATOS DE LA RED -->
            <fieldset class="form-section">
                <legend>Configuración de la Red</legend>
                
                <div class="form-group">
                    <label for="nombreRed">Nombre de la Red (SSID)</label>
                    <input type="text" id="nombreRed" placeholder="Ej. WiFi_Casa_Perez" required>
                </div>

                <div class="form-group password-group">
                    <label for="password">Contraseña de WiFi</label>
                    <input type="text" id="password" placeholder="Ej. P@ssw0rd2026!" required>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Guardar Credenciales</button>
        </form>
    </div>

    <script>
        // Función auxiliar para actualizar el enlace del mapa dinámicamente
        // Función auxiliar para actualizar el enlace del mapa dinámicamente (Formato Directo)
function actualizarEnlaceMapa(texto) {
    var btn = document.getElementById('btnVerMapa');
    if (texto.trim() !== "" && texto !== "Obteniendo ubicación...") {
        // Formato directo de coordenadas para Google Maps sin pasar por buscadores alternos
        btn.href = "https://google.com" + encodeURIComponent(texto.trim());
    } else {
        btn.href = "https://google.com";
    }
}

        

        // 1. GESTIÓN DEL GPS
        document.getElementById('btnGeolocalizar').onclick = function() {
            var input = document.getElementById('ubicacion');
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta GPS.");
                return;
            }
            input.value = "Obteniendo ubicación...";
            
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lon = position.coords.longitude;
                var coordenadas = lat + ", " + lon;
                input.value = coordenadas;
                actualizarEnlaceMapa(coordenadas);
            }, function(error) {
                alert("Permiso de ubicación denegado o GPS desactivado.");
                input.value = "";
                actualizarEnlaceMapa("");
            });
        };

        // Escucha si el usuario escribe la dirección manualmente
        document.getElementById('ubicacion').oninput = function() {
            actualizarEnlaceMapa(this.value);
        };

        // 2. GUARDAR EN MEMORIA (LOCALSTORAGE)
        document.getElementById('wifiForm').onsubmit = function(e) {
            e.preventDefault();
            
            var nuevoCliente = {
                id: Date.now(),
                nombre: document.getElementById('nombreCliente').value,
                ubicacion: document.getElementById('ubicacion').value,
                red: document.getElementById('nombreRed').value,
                password: document.getElementById('password').value
            };
            
            var registros = JSON.parse(localStorage.getItem('wifi_records')) || [];
            registros.push(nuevoCliente);
            localStorage.setItem('wifi_records', JSON.stringify(registros));
            
            alert("¡Cliente guardado exitosamente!");
            document.getElementById('wifiForm').reset();
            actualizarEnlaceMapa("");
            window.location.href = "registros.html";
        };
    </script>
</body>
</html>
